name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Prepare updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY secret is missing."
            exit 1
          }

          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()

          if ($key -like "dW50cnVzdGVk*") {
            # If it is already base64-encoded, remove ALL whitespace
            $base64key = $key -replace '\s', ''
          } elseif ($key -like "untrusted comment:*") {
            # If it is the raw key file, normalize newlines and convert to base64
            $normalized = $key.Replace("`r`n", "`n").Replace("`r", "`n")
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($normalized)
            $base64key = [System.Convert]::ToBase64String($bytes)
          } else {
            # Fallback: remove all whitespace
            $base64key = $key -replace '\s', ''
          }

          # Set the environment variable for subsequent steps
          "TAURI_SIGNING_PRIVATE_KEY=$base64key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Signing key prepared and set in GITHUB_ENV"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dash Hub ${{ github.ref_name }}'
          releaseBody: 'Veja as notas de atualização da versão.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --verbose --bundles nsis
